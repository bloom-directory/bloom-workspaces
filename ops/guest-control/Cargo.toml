[package]
name = "bloom-guest-control"
version = "1.0.0"
edition = "2021"
description = "Bounded guest-side file, job, and Bloom status service for Bloom Workspaces"
license = "MIT"

[[bin]]
name = "bloom-guest-control"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
libc = "0.2"
once_cell = "1"
